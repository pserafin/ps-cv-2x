@if(data().length == 1) {
  <ps-main-stepper-item [data]="data()[0]" [position]="position()" [icon]="icon()" />
}
@if(data().length > 1) {
  <!-- Projects within one company, as tabs -->
  <p-tabs [(value)]="activeStep" scrollable>
    <p-tablist>
      @for(item of data(); track item.name; let i=$index) {
        <p-tab [value]="i+1">{{item.name}}</p-tab>
      }
    </p-tablist>
    <p-tabpanels>
      @for(item of data(); track item.name; let i=$index) {
        <p-tabpanel [value]="i+1">
          <ps-main-stepper-item [data]="item" [position]="position()" [icon]="icon()" />
        </p-tabpanel>
      }
    </p-tabpanels>
  </p-tabs>
}
