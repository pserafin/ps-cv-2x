<ul class="refs">
  @for (ref of data(); track ref.author; let i = $index) {
    <li class="ref">
      <figure>
        <blockquote class="ref-text" [class.clamped]="!isExpanded(i)" [id]="'ref-text-' + i">
          @for (p of ref.text; track $index) {
            <p>{{ p }}</p>
          }
        </blockquote>
        <figcaption class="ref-footer">
          <span class="ref-author">{{ ref.author }}</span>
          <button
            type="button"
            class="ref-toggle"
            (click)="toggle(i)"
            [attr.aria-expanded]="isExpanded(i)"
            [attr.aria-controls]="'ref-text-' + i">
            {{ isExpanded(i) ? 'Show less' : 'Read more' }}
            <i class="pi" [class.pi-chevron-down]="!isExpanded(i)" [class.pi-chevron-up]="isExpanded(i)" aria-hidden="true"></i>
          </button>
        </figcaption>
      </figure>
    </li>
  }
</ul>
