<p-stepper [value]="activeStep()" (valueChange)="onValueChange($event)">
  @for(item of experience(); track item.company; let i = $index ) {
    <p-step-item [value]="i+1">
        <p-step>{{item.company}}<span class="date-chip step-date">{{item.date}}</span></p-step>
        <p-step-panel class="{{i==(experience().length-1) ? 'p-step-panel-last' : ''}}">
            <ng-template #content>
                <div class="flex flex-col w-full min-w-0 pb-4">
                    <div class="p-card p-4 w-full min-w-0">
                      <ps-main-stepper-list [data]="item.projects" [position]="item.position" [icon]="item.icon" [(activeStep)]="innerStep"/>
                    </div>
                </div>
            </ng-template>
        </p-step-panel>
    </p-step-item>
  }
</p-stepper>
