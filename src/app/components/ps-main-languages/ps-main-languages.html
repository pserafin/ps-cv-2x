<div class="flex flex-row flex-wrap justify-around gap-4">
  @for(item of data(); track item.name) {
    <div class="circle-bg">
      <a class="circle-link bg" title="{{item.name}}">
        <img src="{{item.icon}}" width="24" alt="" />
      </a>
      <p class="lang-name">{{item.name}} <br> ({{item.level}})</p>
    </div>
  }
</div>
